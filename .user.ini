; --- Endurecimiento de sesión SISGEDO ---
; La cookie de sesión no es accesible desde JavaScript (mitiga robo por XSS)
session.cookie_httponly = 1
; La cookie no se envía en peticiones entre sitios (mitiga CSRF)
session.cookie_samesite = "Lax"
; Rechaza IDs de sesión no inicializados por el servidor
session.use_strict_mode = 1
; No exponer versión de PHP en las cabeceras
expose_php = Off
